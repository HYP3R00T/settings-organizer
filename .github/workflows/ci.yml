name: Release new package
on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Configure Git
        run: |
          git config --global user.email "hyperoot.tech@proton.me"
          git config --global user.name "Rajesh"

      - name: Ensure clean working directory
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: commit uncommitted changes before version bump"

      - name: Auto-increment version and tag
        id: versioning
        run: |
          # Increment the version and create a new tag
          NEW_VERSION=$(npm version patch -m "Release version %s")
          echo "New version: $NEW_VERSION"
          # Output the new tag
          echo "new_tag=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Push changes
        run: |
          git push origin HEAD
          git push origin ${{ steps.versioning.outputs.new_tag }}

      - name: Package VSCode extension
        run: |
          npm install -g vsce
          vsce package

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.versioning.outputs.new_tag }}
          name: Release ${{ steps.versioning.outputs.new_tag }}
          artifacts: ./*.vsix
          draft: false
          prerelease: false

      - name: Publish to VSCode Marketplace
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          vsce publish -p $VSCE_TOKEN
